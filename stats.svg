<svg xmlns="http://www.w3.org/2000/svg" width="560" height="652" viewBox="0 0 560 652" role="img" aria-label="GitHub stats">
<style>
  :root { --fg:#1f2328; --muted:#656d76; --card:#f6f8fa; --track:#d0d7de; --line:#d0d7de; --accent:#0969da }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6edf3; --muted:#8b949e; --card:#161b22; --track:#30363d; --line:#30363d; --accent:#2f81f7 }
  }
  svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px }
  rect.box { fill: var(--card); stroke: var(--line) }
  rect.track { fill: var(--track) }
  rect.fill { fill: var(--accent) }
  text { fill: var(--fg) }
  text.m { fill: var(--muted) }
  text.big { font-size: 20px; font-weight: 600 }
  text.lbl, text.sec { font-size: 10px; letter-spacing: 1px; fill: var(--muted) }
</style>
